---
- name: Install Docker and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Make sure Docker is running and starts at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
