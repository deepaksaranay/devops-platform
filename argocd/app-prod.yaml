apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR-USER/devops-platform.git
    targetRevision: main
    path: deploy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-prod
  # No "automated" block: a person presses Sync after reviewing the change.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
