apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR-USER/devops-platform.git
    targetRevision: main
    path: deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-dev
  syncPolicy:
    # Dev follows Git automatically: merge to main -> deployed.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
