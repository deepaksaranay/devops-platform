server {
    listen 80;

    # Metrics are for Prometheus only, not for the public.
    location /metrics {
        deny all;
        return 403;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
